[project]
name = "codex-guardian"
version = "0.1.0"
description = "A policy and review layer for proposed Codex actions."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Codex Guardian Contributors" }
]
keywords = ["codex", "ai-safety", "approval", "policy", "mcp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Security"
]

[project.scripts]
codex-guardian = "codex_guardian.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
